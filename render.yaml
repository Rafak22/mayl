services:
  - type: web
    name: relay-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AGENT_MODE
        value: demo
      - key: ALLOWED_ORIGINS
        value: "*"
