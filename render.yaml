services:
  - type: web
    name: relay-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AGENT_MODE
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false   # paste your key in the Render dashboard; without it the agents run in demo mode
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: ALLOWED_ORIGINS
        value: "*"
